<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車のアニメーション</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            height: 100vh;
        }
        
        .road {
            position: absolute;
            bottom: 30%;
            width: 100%;
            height: 100px;
            background: #333;
            border-top: 3px solid #fff;
            border-bottom: 3px solid #fff;
        }
        
        .road-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 5px;
            background: repeating-linear-gradient(
                to right,
                #fff 0px,
                #fff 50px,
                transparent 50px,
                transparent 100px
            );
        }
        
        .car {
            position: absolute;
            right: -150px;
            bottom: 35%;
            font-size: 60px;
            animation: drive 5s linear infinite;
        }
        
        @keyframes drive {
            0% {
                right: -150px;
            }
            100% {
                right: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="road">
        <div class="road-line"></div>
    </div>
    <div class="car">🚗</div>
</body>
</html>
